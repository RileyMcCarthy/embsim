[package]
name = "embsim-qemu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A host computer on the board: a QEMU virtual machine whose guest time the board's clock meters, its serial port levels on nets"
keywords = ["embedded", "emulator", "simulation", "sil", "qemu"]
categories = ["embedded", "simulation"]

# The host's own system QEMU (qemu-system-aarch64 under HVF, qemu-system-x86_64
# under KVM, or either under TCG), run as a program of its own and driven over
# QMP: nothing of QEMU is linked or carried, so the crate is MIT alone.

[dependencies]
embsim-core = { path = "../core" }
embsim-board = { path = "../board" }
# The two bench component kinds join a project's set (`catalog::register`).
embsim-boards = { path = "../boards" }
# poll(2) and read/write on the guest's serial socket.
libc.workspace = true
# QMP is JSON over a socket.
serde_json.workspace = true
# The kinds' list options (`args`), read as the project file wrote them.
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
vibes-behaviour = { git = "https://github.com/RileyMcCarthy/vibes.git" }
