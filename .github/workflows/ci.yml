name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # A manual run builds and packages the release binaries without
  # publishing anything: the way to try a release before tagging it
  # (TESTING.md, "Releases").
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + unit/integration tests + doctests on both supported platforms.
  # The whole workspace is firmware-free: every crate tests standalone. The
  # memory-inspect DWARF tests compile a C fixture with clang (preferred; the
  # parser targets clang-emitted DWARF) and skip gracefully without a C
  # toolchain.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (all targets)
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Doc tests
        run: cargo test --workspace --doc
      # Feature-matrix leg: the default build has embsim-trace's `web` feature
      # on (axum + tokio + embsim-ui). Exercise the headless recorder path with
      # the web feature OFF so it can't silently rot.
      - name: Build embsim-trace (web off)
        run: cargo build -p embsim-trace --no-default-features
      - name: Test embsim-trace (web off)
        run: cargo test -p embsim-trace --no-default-features
      # Timing-sensitive paths (serial baud pacing, pulse_out integration,
      # board stream pacing) can differ under optimisations — smoke them in
      # release on the ubuntu leg only (macOS already ran debug).
      - name: Release smoke (board)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p embsim-board --release

  # Determinism gate (DETERMINISM.md, "CI shape"). Phase D1 made this
  # non-vacuous: in stepped clock mode the engine event log — order AND every
  # virtual timestamp — must be identical across runs and match a blessed
  # golden trace.
  #
  # Build once, then run the binary 5x as SEPARATE PROCESSES: a fresh process
  # re-seeds every HashMap, which is the class of nondeterminism in-process
  # repetition cannot reach for long-lived engine maps. (The binary also
  # re-execs itself for its own cross-process case; running it 5x here is the
  # outer net, and catches a case that only fails on some seeds.)
  #
  # Ubuntu only for now — the release-smoke leg is the precedent for a
  # single-OS extra leg. macOS joins once the float-quantization question has
  # data rather than speculation; the local macOS run of this suite is green,
  # including in --release.
  determinism:
    name: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the determinism binaries
        run: cargo build -p embsim-board --tests
      - name: N-run identity + goldens, 5x as separate processes
        run: |
          set -euo pipefail
          for run in 1 2 3 4 5; do
            echo "::group::determinism run $run"
            cargo test -p embsim-board --test determinism -- --nocapture
            echo "::endgroup::"
          done
      - name: Stepped-clock engine mechanics
        run: |
          set -euo pipefail
          cargo test -p embsim-board --test stepped_clock -- --nocapture
          cargo test -p embsim-board --test ads122u04_stepped -- --nocapture
      # A golden that no longer matches must fail the build, not be silently
      # rewritten. Blessing is a deliberate local act (EMBSIM_BLESS=1), so a
      # dirty fixture tree here means the goldens were regenerated by a test
      # run — which would make the comparison vacuous.
      - name: Goldens are unmodified
        run: git diff --exit-code -- board/tests/fixtures/traces

  # Line/region coverage report (soft gate). Publishes a job summary; does not
  # fail on threshold yet — see coverage-baseline.txt and TESTING.md. Installs
  # cargo-llvm-cov + llvm-tools so `cargo llvm-cov` works out of the box.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage summary
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --lcov --output-path lcov.info \
            --summary-only 2>&1 | tee coverage-summary.txt
          {
            echo "## Coverage (soft gate — no threshold fail)"
            echo '```'
            tail -40 coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: embsim-lcov-${{ github.run_number }}
          path: lcov.info
          retention-days: 14

  # Both rustfmt and clippy are gating. The lint backlog has been cleared, so
  # clippy runs with `-D warnings` — any new lint fails the build. The few
  # unavoidable lints (interior-mutable const array seeds, await-holding-lock in
  # single-threaded tests, an intentional enum prefix) carry item-scoped
  # `#[allow(...)]`s with `// justification:` comments; no crate-level blanket
  # allows are used.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt (gating)
        run: cargo fmt --all --check
      - name: clippy (gating)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # API docs must build without warnings (broken intra-doc links, etc.).
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (deny warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Supply-chain audit: RustSec advisories + license allow-list (see deny.toml).
  # Vulnerabilities, unmaintained/unsound/yanked crates, disallowed licenses, or
  # unknown sources all fail the build.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # MSRV guard: the workspace pins rust-version = 1.88 (gimli 0.34). Build only
  # — MSRV governs compilation, not test/runtime behavior.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Build (workspace) on MSRV
        run: cargo build --workspace

  # Single required status check for branch protection on `main`. Aggregates
  # every job above: fails if any FAILED/CANCELLED, passes when all succeeded.
  # Mark "CI Gate" as the required check so individual job renames don't leave
  # protection pointing at a missing context. Jobs are not path-filtered, so
  # none are "legitimately skipped" today — still use always() so a cancelled
  # matrix leg can't leave the gate stuck pending forever.
  # What behaviour does this change add, and what stopped holding? Answered
  # from the tests via Vibes (github.com/RileyMcCarthy/vibes) and posted to the
  # PR as one comment, edited in place on each run. Advisory, not in the gate:
  # exit 1 means a claim broke or was removed, which a reviewer decides on.
  vibes:
    name: Behaviour ledger
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the report diffs against the base branch
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Node is here only for Vibes. `npm ci` installs it from git and builds
      # it via its `prepare` script; the Rust binding the tests use resolves
      # through Cargo on its own.
      #
      # Keep CLI (package-lock) and binding (Cargo.lock) on the same vibes
      # commit. Prefer git+https in package-lock so HTTPS-only tokens work.
      - name: Vibes CLI/binding lockstep
        run: |
          python3 - <<'PY'
          import re, sys
          cargo = open("Cargo.lock", encoding="utf-8").read()
          npm = open("package-lock.json", encoding="utf-8").read()
          m_c = re.search(
              r'name = "vibes-behaviour"\nversion = "[^"]+"\n'
              r'source = "git\+https://github\.com/RileyMcCarthy/vibes\.git#([0-9a-f]+)"',
              cargo,
          )
          m_n = re.search(
              r'"node_modules/vibes"\s*:\s*\{[^}]*?'
              r'"resolved"\s*:\s*"git\+https://github\.com/RileyMcCarthy/vibes\.git#([0-9a-f]+)"',
              npm,
              re.S,
          )
          if not m_c:
              sys.exit("vibes-behaviour git+https SHA not found in Cargo.lock")
          if not m_n:
              sys.exit(
                  "node_modules/vibes git+https SHA not found in package-lock.json "
                  "(ssh resolved URLs are not accepted)"
              )
          if m_c.group(1) != m_n.group(1):
              print(
                  f"::error::vibes SHA mismatch: Cargo.lock={m_c.group(1)} "
                  f"package-lock.json={m_n.group(1)}"
              )
              sys.exit(1)
          print(f"vibes lockstep OK: {m_c.group(1)}")
          PY

      - name: Install Vibes
        run: npm ci --no-audit --no-fund

      - name: Behaviour report
        id: report
        run: |
          set +e
          npx vibes report --base "origin/${{ github.base_ref }}" > vibes-report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat vibes-report.md

      - name: Post the report to the PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- vibes-ledger -->'
          { echo "$marker"; head -c 60000 vibes-report.md; } > body.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md >/dev/null \
              && echo "updated comment $existing" || echo "::warning::could not update the PR comment (read-only token on a fork?)"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null \
              && echo "posted comment" || echo "::warning::could not post the PR comment (read-only token on a fork?)"
          fi

      - name: Propagate the verdict
        run: exit ${{ steps.report.outputs.code }}

  # The P2 core boots the real Parallax ROM off the P2-EC32MB's flash, over
  # nets, with QEMU as the CPU in a qemu-system-p2 of its own
  # (p2-qemu/README.md). The program is built and installed the way a user
  # gets it, `embsim qemu install`, and cached on what decides it: the runner
  # image (the program links its glib), the QEMU pin and the target's
  # identity (a digest of p2-qemu/qemu-target's sources, QEMU_PIN among
  # them), all three read from the plan the command would follow. Every test
  # that needs the program is #[ignore]d in the other jobs, so this is the
  # one job that needs QEMU. Linux: the shared page's futex path, on both
  # sides; the socket fallback too.
  p2-qemu-boot:
    name: p2-qemu-boot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libglib2.0-dev flex bison python3-venv

      - name: Build the embsim command
        run: cargo build -p embsim-cli

      # `env` holds only workflow-set variables, so ImageOS and ImageVersion
      # are read from the shell.
      - name: What the install builds
        id: plan
        run: |
          set -euo pipefail
          plan=$(target/debug/embsim qemu install --dry-run)
          echo "$plan"
          echo "target=$(echo "$plan" | awk '$1 == "target" { print $2 }')" >> "$GITHUB_OUTPUT"
          echo "qemu=$(echo "$plan" | awk '$1 == "qemu" { print $2 "-" $3 }')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      # The installed program, not the ~150 MB build tree: the ~8 MB binary,
      # its licences, NOTICE and source.
      - name: Cache qemu-system-p2
        uses: actions/cache@v6
        with:
          path: ~/.embsim/qemu/${{ steps.plan.outputs.target }}
          key: qemu-system-p2-${{ runner.os }}-${{ steps.plan.outputs.image }}-${{ steps.plan.outputs.qemu }}-${{ steps.plan.outputs.target }}

      # On a cache hit this starts the cached program, checks its handshake
      # and builds nothing.
      - name: embsim qemu install
        run: target/debug/embsim qemu install --jobs 4

      - name: Which qemu-system-p2 the tests start
        run: target/debug/embsim qemu path

      - name: Boot the ROM off the module's flash, over the nets (shared page)
        run: cargo test -p embsim-p2-qemu -- --include-ignored --nocapture

      - name: The same over the socket pair
        env:
          EMBSIM_P2_QEMU_TRANSPORT: socket
        run: >-
          cargo test -p embsim-p2-qemu --test rom_boot_ec32mb --test crystal_pll
          --test pad_modes --test lifecycle -- --include-ignored --nocapture

      # The same boot said by a project file and run by the `embsim`
      # command (`core = "qemu"`), and `embsim qemu path` finding the
      # installed program.
      - name: Boot the P2 from a project with embsim run
        run: cargo test -p embsim-cli --test cli -- --include-ignored --nocapture

  # The host's Chrome metered by the board's clock (embsim-cdp, NODES.md
  # §15): the node against the runner's own google-chrome, headless, its
  # pages (cdp/tests/pages) served by the test. The cases are #[ignore]d in
  # the test job, so this is the one job that launches Chrome for them: the
  # worker canary (a dedicated worker's 4 ms timer ticks 100 times in 400
  # grants of 1 ms), the clocks, bytes round trip through the port shim,
  # Chrome's close-while-locked and replug rules, and a page shaped like
  # MaD Control against a stand-in board. What they assert is virtual time
  # and bytes; host time per slice is printed, never asserted.
  chrome-cdp:
    name: chrome-cdp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chrome's
      # sandbox uses.
      - name: Let Chrome's sandbox make its namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Which Chrome
        run: google-chrome --version
      - name: The node against real Chrome
        env:
          CHROME: /usr/bin/google-chrome
        run: >-
          cargo test -p embsim-cdp --test real_chrome --
          --ignored --nocapture --test-threads 1

  # A project's own catalog crates (PROJECTS.md §10, "The runner"): the
  # `embsim` binary writes a runner beside examples/custom-project, builds
  # it with Cargo in the release profile and runs the project through it; a
  # crate `embsim new --catalog` starts builds and runs outside any
  # workspace; a crate that does not compile shows rustc's errors. Each case
  # needs a build of embsim, so they are #[ignore]d in the test job's suites
  # and run here, where the release build is paid once (and cached).
  project-runner:
    name: project-runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build a project's catalog crates into a runner and run it
        run: cargo test -p embsim-cli --test runner -- --ignored --nocapture

  ci-gate:
    name: CI Gate
    needs:
      - test
      - determinism
      - coverage
      - lint
      - docs
      - supply-chain
      - msrv
      - p2-qemu-boot
      - chrome-cdp
      - project-runner
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          failed=$(echo "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::CI Gate failed — these required jobs did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "CI Gate passed — every required job succeeded."

  # The prebuilt `embsim` for each platform a release ships, on a v* tag
  # (or a manual run, which keeps them as this run's artifacts and
  # publishes nothing). Built where it runs, so each is run before it is
  # packaged: its version and revision are the tag's with no changes, its
  # QEMU plan is this checkout's P2 target, and it checks and runs a
  # shipped project (.github/scripts/release.py). No cache: a release is
  # built from nothing. Linux builds on the oldest Ubuntu runner GitHub
  # has, so the binary needs glibc 2.35 at most, which the script checks.
  # Starts beside the CI Gate; `release` publishes only when both pass.
  release-binaries:
    name: release binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: The tag is the version, and the changelog has it
        run: python3 .github/scripts/release.py check
      - name: Build
        run: cargo build --release --locked -p embsim-cli --target ${{ matrix.target }}
      - name: Run it, then package it
        run: python3 .github/scripts/release.py binary --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Tag-driven GitHub Release (vX.Y.Z), on the tag's push only. Same gate as
  # branch protection: only publishes after CI Gate succeeds on the tagged
  # commit, and every release binary was built, run and packaged. Attaches
  # the binaries, the P2 target's sources (what `embsim qemu install` builds
  # qemu-system-p2 from: the target every binary was checked to carry) and
  # SHA256SUMS; the notes are CHANGELOG.md's section for the version and a
  # table of the assets. No crates.io publish.
  release:
    name: GitHub Release
    needs: [ci-gate, release-binaries]
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.ci-gate.result == 'success' && needs.release-binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: The P2 target's sources, the checksums and the notes
        id: assets
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py check
          python3 .github/scripts/release.py qemu-target --out dist
          python3 .github/scripts/release.py checksums dist
          python3 .github/scripts/release.py notes --dir dist --out release-notes.md
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          name: embsim ${{ steps.assets.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
