# The catalog crate `embsim new --catalog` starts, kept as a crate of this
# workspace so every gate compiles, lints and documents it, and
# `cli/tests/template.rs` checks and runs a project naming its kinds.
# `embsim new --catalog DIR` copies `src/lib.rs` with the project's name in
# place of "yourproject", and writes a manifest of its own like this one
# whose paths reach the embsim checkout (cli/src/scaffold.rs).
[package]
name = "yourproject-catalog"
version = "0.1.0"
edition = "2021"
publish = false
description = "The catalog crate `embsim new --catalog` starts: one example of each sort of kind"

[dependencies]
embsim-board = { path = "../../board" }
embsim-boards = { path = "../../boards" }
