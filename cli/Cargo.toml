[package]
name = "embsim-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The embsim command: survey a netlist, start a project, check it, run it, with a project's own catalog crates built in"
keywords = ["embedded", "emulator", "simulation", "sil", "cli"]
categories = ["command-line-utilities", "simulation"]

# The command is a library (`embsim_cli::main_with`, `embsim_cli::run`,
# `embsim_cli::runner_main`) and the `embsim` binary is the tool over it
# (`embsim_cli::tool_main`): the catalogs embsim ships, and for a project
# with kinds of its own, the runner it builds over the project's crates.
[lib]
name = "embsim_cli"
path = "src/lib.rs"

[[bin]]
name = "embsim"
path = "src/main.rs"

[dependencies]
embsim-board = { path = "../board" }
embsim-boards = { path = "../boards" }
embsim-core = { path = "../core" }
# QEMU as a P2 core, in a `qemu-system-p2` of its own (`embsim qemu`).
embsim-p2-qemu = { path = "../p2-qemu" }
# The host computer as a VM the board's clock meters: the `qemu-vm` and
# `chrome-vm` bench component kinds, on the host's own system QEMU.
embsim-qemu = { path = "../qemu" }
clap.workspace = true
# `run`'s SIGINT/SIGTERM handler: the first signal ends the run with its
# summary.
libc.workspace = true
# Cargo's build report, read for the runner's binary and the embsim
# libraries it links (`src/runner.rs`).
serde_json.workspace = true
toml.workspace = true
# `embsim new --catalog --add-to`: a project's `[catalog]` edited in place,
# its comments kept.
toml_edit.workspace = true

[dev-dependencies]
rstest.workspace = true
# The crate `embsim new --catalog` starts, run in process
# (`tests/template.rs`).
yourproject-catalog = { path = "catalog-template" }
# A catalog kind built as an `Assembly` of embsim's machine models
# (`tests/assembly.rs`).
embsim-models = { path = "../models" }
vibes-behaviour = { git = "https://github.com/RileyMcCarthy/vibes.git" }
