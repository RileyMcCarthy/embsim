[package]
name = "embsim-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The embsim command: survey a netlist, start a project, check it, run it"
keywords = ["embedded", "emulator", "simulation", "sil", "cli"]
categories = ["command-line-utilities", "simulation"]

# Links QEMU into the binary when embsim-p2-qemu linked it (EMBSIM_QEMU_P2_BUILD
# named a QEMU tree), and sets `cfg(qemu_linked)` so the tests that boot the P2
# are built only then.
build = "build.rs"

# The command is a library (`embsim_cli::main_with`, `embsim_cli::run`) and
# the `embsim` binary is it over the catalogs embsim ships, so a project with
# kinds of its own runs the same command from a binary of its own.
[lib]
name = "embsim_cli"
path = "src/lib.rs"

[[bin]]
name = "embsim"
path = "src/main.rs"

[dependencies]
embsim-board = { path = "../board" }
embsim-boards = { path = "../boards" }
embsim-core = { path = "../core" }
embsim-p2-qemu = { path = "../p2-qemu" }
clap.workspace = true
# `run`'s SIGINT/SIGTERM handler: the first signal ends the run with its
# summary.
libc.workspace = true
toml.workspace = true

[dev-dependencies]
rstest.workspace = true
vibes-behaviour = { git = "https://github.com/RileyMcCarthy/vibes.git" }
