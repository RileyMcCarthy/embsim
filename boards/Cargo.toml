[package]
name = "embsim-boards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND CC-BY-SA-4.0"
repository.workspace = true
description = "Off-the-shelf boards and modules for embsim, as netlists plus the components that populate them"
keywords = ["embedded", "emulator", "simulation", "sil"]
categories = ["embedded", "simulation"]

[dependencies]
embsim-board = { path = "../board" }
embsim-core = { path = "../core" }
embsim-models = { path = "../models" }
# A bench component kind's options that are lists (`scripted-source`'s
# `steps`), read as the project file wrote them.
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
# The host-serial test opens its PTYs non-blocking, as host software does.
libc.workspace = true
vibes-behaviour = { git = "https://github.com/RileyMcCarthy/vibes.git" }
