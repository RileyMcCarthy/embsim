# Two boards joined connector to connector: two copies of the header board,
# J1 pin for pin, the bench's ground on the left one. Each board's R1 runs
# from its SIG to its GND, so a signal on either J1.1 sees both resistors.

[[board]]
name = "LEFT"
kind = "netlist"
netlist = "header.net"

[[board]]
name = "RIGHT"
kind = "netlist"
netlist = "header.net"

[[wire]]
from = "LEFT.J1.1"
to = "RIGHT.J1.1"

[[wire]]
from = "LEFT.J1.2"
to = "RIGHT.J1.2"

[[wire]]
from = "BENCH.GND"
to = "LEFT.J1.2"
volts = 0.0
