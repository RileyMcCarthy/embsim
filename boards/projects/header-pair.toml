# Two boards joined connector to connector: two copies of the header board,
# their J1s mated pin for pin, the bench's ground on the left one. Each
# board's R1 runs from its SIG to its GND, so a signal on either J1.1 sees
# both resistors.

[[board]]
name = "LEFT"
kind = "netlist"
netlist = "header.net"

[[board]]
name = "RIGHT"
kind = "netlist"
netlist = "header.net"

# Each pin of LEFT's J1 to RIGHT's J1 pin of the same number.
[[mate]]
a = "LEFT.J1"
b = "RIGHT.J1"

[[wire]]
from = "BENCH.GND"
to = "LEFT.J1.2"
volts = 0.0
