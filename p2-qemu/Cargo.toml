[package]
name = "embsim-p2-qemu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The crate's code is MIT, as every embsim crate's is, and links nothing of
# QEMU: QEMU runs as its own program, `qemu-system-p2`, a separate GPL-2.0
# work, over a small fixed protocol (src/protocol.rs). The package also
# carries, as data it never compiles, the QEMU target that program is built
# from (qemu-target/: the target and board LGPL-2.1-or-later, its two QEMU
# patches under the licences of the files they modify, insn.decode MIT), so
# `embsim qemu install` writes out and builds exactly the target this crate
# speaks to (src/target.rs). Each of those files keeps its own licence, said
# in it and in qemu-target/README.md, the texts in LICENSES/.
license.workspace = true
repository.workspace = true
description = "The QEMU Propeller 2 target as an embsim board component: a node that drives pins as edges on nets and boots the way silicon does, with QEMU as a separately installed qemu-system-p2"
keywords = ["embedded", "emulator", "simulation", "sil", "qemu"]
categories = ["embedded", "simulation"]

[dependencies]
embsim-core = { path = "../core" }
embsim-board = { path = "../board" }
# The node is the core inside `embsim_boards::p2::P2Package`, and the pad
# strengths are decoded there (boards never depends back on this crate).
embsim-boards = { path = "../boards" }
# The shared page (mmap), the futex the two processes hand off on, the
# child's process group and its inherited descriptors.
libc.workspace = true
# The target's identity: the digest stage.sh computes with sha256sum.
sha2 = "0.10"
# The `p2` kind's options, handed on to the standard catalog
# (`catalog::QemuCores`).
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
embsim-models = { path = "../models" }
rstest.workspace = true
vibes-behaviour = { git = "https://github.com/RileyMcCarthy/vibes.git" }
