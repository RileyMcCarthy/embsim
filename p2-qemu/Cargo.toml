[package]
name = "embsim-p2-qemu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The node (Rust, hostdrive.c) is MIT; the QEMU target it carries in
# qemu-target/ is LGPL-2.1-or-later (LICENSES/, qemu-target/README.md).
license = "MIT AND LGPL-2.1-or-later"
repository.workspace = true
description = "The QEMU Propeller 2 target as an embsim board component: a node that drives pins as edges on nets and boots the way silicon does"
keywords = ["embedded", "emulator", "simulation", "sil", "qemu"]
categories = ["embedded", "simulation"]

# The node links QEMU as a library — several hundred objects scraped from a
# configured QEMU build tree. That tree is found through EMBSIM_QEMU_P2_BUILD at
# build time. When the variable is unset the crate still compiles, to a stub
# that says so, because a workspace must build on a machine with no QEMU.
build = "build.rs"
# Names the QEMU link so a dependent's build script is handed it
# (`DEP_QEMU_P2_LINK_ARGS_FILE`, `DEP_QEMU_P2_LINKED`; build.rs).
links = "qemu-p2"

[dependencies]
embsim-core = { path = "../core" }
embsim-board = { path = "../board" }
# The node is the core inside `embsim_boards::p2::P2Package`, and the pad
# strengths are decoded there (boards never depends back on this crate).
embsim-boards = { path = "../boards" }
# The `p2` kind's options, handed on to the standard catalog
# (`catalog::QemuCatalog`).
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
embsim-models = { path = "../models" }

[build-dependencies]
cc = "1"
