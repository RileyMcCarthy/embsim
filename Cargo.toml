[workspace]
members = [
    "board",
    "core",
    "models",
    "boards",
    "p2-qemu",
    "qemu",
    "tools/memory-inspect",
    "tools/ui",
    "tools/trace",
    "cpu-oracle",
    "cli",
    # The catalog crate `embsim new --catalog` starts, compiled here so the
    # gates hold it to the API it is written against.
    "cli/catalog-template",
    # A project with kinds of its own (examples/custom-project/README.md).
    "examples/custom-project/catalog",
]
resolver = "2"

# Shared package metadata. A crate opts in with `version.workspace = true`,
# `license.workspace = true`, etc.
[workspace.package]
version = "0.2.0"
edition = "2021"
# Minimum supported Rust version. Determined empirically: gimli 0.34 (pulled in
# by tools/memory-inspect) requires rustc 1.88, and 1.88 builds the whole
# workspace cleanly while 1.87 is rejected at the gimli version-gate. Gated by
# the `msrv` job in .github/workflows/ci.yml.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/RileyMcCarthy/embsim"

# Centralized external dependency versions to prevent drift across crates.
[workspace.dependencies]
nix = { version = "0.31" }
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
libc = "0.2"
object = "0.40"
gimli = "0.34"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
toml_edit = "0.22"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
# The `embsim` command line (cli/): subcommands and their options, derived.
clap = { version = "4.5", features = ["derive", "string"] }
# Test harness: discrete case matrices (`#[rstest]`, `#[case]`, `#[values]`).
# See TESTING.md. All workspace crates that ship tests take this as a
# dev-dependency so failure names and filters stay consistent.
rstest = "0.27"
# Property testing for continuous domains only (MNA ladders, buffer clamps).
# Prefer rstest for enums / channel indices / OOR grids.
proptest = "1"
